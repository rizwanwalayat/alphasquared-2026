# Static site — nothing to build, publish the repo root as-is.
[build]
  publish = "."
  command = ""

# The forms and the assistant write to MongoDB Atlas through these. Each
# function declares its own /api/* path, so no redirect is needed.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["mongodb"]

# Pretty URLs: /trucking instead of /trucking.html
[[redirects]]
  from = "/trucking"
  to = "/trucking.html"
  status = 200

[[redirects]]
  from = "/driveaway"
  to = "/trucking.html"
  status = 301

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/trust"
  to = "/trust.html"
  status = 200

[[redirects]]
  from = "/case-studies"
  to = "/case-studies.html"
  status = 200

# Splat so every generated detail page gets the extensionless URL too.
[[redirects]]
  from = "/case-studies/:slug"
  to = "/case-studies/:slug.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Versioned assets are safe to cache hard; the ?v= query busts them on deploy.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# HTML must revalidate, or a stale document keeps pointing at old asset versions.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The write endpoints return nothing cacheable. The read endpoint sets its own
# Cache-Control, so it is deliberately not covered here.
[[headers]]
  for = "/api/lead"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/api/chat"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "same-origin"

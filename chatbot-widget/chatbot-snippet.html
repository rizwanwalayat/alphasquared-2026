<!-- ============ Ask Alpha² — chat widget ============
     Paste this block right before the closing </body> tag, 
     after your existing <script> tags (main.js, gsap, etc).
     Requires chatbot.css linked in <head> and chatbot.js included below it. -->

<button id="askA2-launcher" aria-label="Open chat">
  <div class="askA2-ring"></div>
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
  <div class="askA2-badge-dot" id="askA2-badge-dot">1</div>
</button>

<div id="askA2-panel">
  <div class="askA2-head">
    <div class="askA2-avatar">α²</div>
    <div>
      <div class="askA2-title">Ask Alpha²</div>
      <div class="askA2-status"><span class="askA2-status-dot"></span>Usually replies instantly</div>
    </div>
    <button class="askA2-close" id="askA2-close" aria-label="Close chat">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="askA2-body" id="askA2-body">
    <div class="askA2-msg bot">Hey — I'm the Alpha² assistant. Ask me anything about our work, or tap a question below to get started.</div>
  </div>

  <div class="askA2-quick-wrap">
    <div class="askA2-quick-label">Quick questions</div>
    <div class="askA2-quick-row" id="askA2-quick-row">
      <button class="askA2-quick-btn" data-q="What services do you offer?">What services do you offer?</button>
      <button class="askA2-quick-btn" data-q="Tell me about your AI automation work">Tell me about AI automation</button>
      <button class="askA2-quick-btn" data-q="How do I book a call?">How do I book a call?</button>
      <button class="askA2-quick-btn" data-q="What industries do you work with?">What industries do you work with?</button>
    </div>
  </div>

  <div class="askA2-input-row">
    <input type="text" id="askA2-input" placeholder="Ask anything…">
    <button class="askA2-send" id="askA2-send" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>
  <div class="askA2-disclaimer">Ask Alpha² can make mistakes. For anything important, book a call with our team.</div>
</div>
